<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mintr — Market</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="https://ui-avatars.com/api/?name=M&background=0a0a0a&color=ff2d2d&size=64&bold=true&length=1">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0a0a0a;--c:#121212;--b:#1f1f1f;--t:#f2f2f2;--m:#7a7a7a;--r:#ff2d2d;--gr:#4ade80;--g:#ffd700;--y:#ffb400}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.loader{width:60px;height:60px;border-radius:50%;border:4px solid var(--b);border-top-color:var(--r);animation:s 1s linear infinite;margin:40vh auto 20px}
@keyframes s{to{transform:rotate(360deg)}}
.ldt{text-align:center;color:var(--m);font-size:14px}
.err{padding:40px 24px;text-align:center;color:var(--r);font-size:13px;font-family:monospace;word-break:break-word}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px;min-height:60px}
.back{width:38px;height:38px;border-radius:50%;background:transparent;border:1px solid var(--b);color:var(--t);font-size:18px;font-family:inherit;flex-shrink:0}
.title{font-size:18px;font-weight:900;flex:1;text-align:center;letter-spacing:-.3px}
.hdr-right{display:flex;gap:6px;flex-shrink:0}
.hbtn{padding:9px 14px;border-radius:999px;background:transparent;border:1px solid var(--b);color:var(--t);font-weight:700;font-size:12px;font-family:inherit;cursor:pointer}
.hbtn.primary{background:var(--r);border-color:var(--r);color:#fff}
.hero{padding:12px 16px}
.search{width:100%;padding:12px 16px;background:var(--c);border:1px solid var(--b);border-radius:12px;color:var(--t);font-size:15px;font-family:inherit;outline:none}
.search::placeholder{color:var(--m)}
.cats{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;padding:8px 16px;border-radius:999px;background:transparent;border:1px solid var(--b);color:var(--m);font-size:13px;font-weight:700;font-family:inherit}
.cat.active{background:var(--r);border-color:var(--r);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 24px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;overflow:hidden;cursor:pointer}
.card-img{height:150px;background:linear-gradient(135deg,#2a0a0a,#4a0f0f);display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px 12px}
.card-title{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.card-price{color:var(--r);font-weight:900;font-size:15px}
.card-seller{color:var(--m);font-size:11px;margin-top:4px}
.empty{padding:60px 24px;text-align:center;color:var(--m);font-size:14px;line-height:1.6}
.empty .big{font-size:48px;display:block;margin-bottom:16px}
.page{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;display:none;flex-direction:column}
.page.open{display:flex;transform:translateX(0)}
.ph{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--b);min-height:60px}
.pt{font-weight:800;font-size:17px}
.bk{width:36px;height:36px;border-radius:50%;background:transparent;border:1px solid var(--b);color:var(--t);font-size:18px;font-family:inherit}
.form{padding:20px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--m);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea,.field select{width:100%;padding:14px;background:var(--c);border:1px solid var(--b);border-radius:12px;color:var(--t);font-size:15px;font-family:inherit;outline:none}
.field textarea{resize:none;min-height:100px;line-height:1.5}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--m) 50%),linear-gradient(135deg,var(--m) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ph-item{aspect-ratio:1;border-radius:12px;border:1px solid var(--b);background:var(--c);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.ph-item img{width:100%;height:100%;object-fit:cover}
.ph-item .plus{font-size:24px;color:var(--m)}
.ph-item .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:none;font-size:12px;font-family:inherit}
.submit-bar{position:sticky;bottom:0;padding:16px;background:var(--bg);border-top:1px solid var(--b)}
.submit{width:100%;padding:15px;border-radius:999px;background:var(--r);color:#fff;border:none;font-weight:800;font-size:16px;font-family:inherit}
.submit:disabled{opacity:.5}
.product-hero{height:300px;background:linear-gradient(135deg,#2a0a0a,#4a0f0f);display:flex;align-items:center;justify-content:center;font-size:120px;overflow:hidden}
.product-hero img{width:100%;height:100%;object-fit:cover}
.product-thumbs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto}
.product-thumbs::-webkit-scrollbar{display:none}
.pt-thumb{width:60px;height:60px;border-radius:10px;overflow:hidden;border:2px solid transparent;flex-shrink:0;cursor:pointer;background:var(--c)}
.pt-thumb.on{border-color:var(--r)}
.pt-thumb img{width:100%;height:100%;object-fit:cover}
.product-body{padding:18px 16px}
.product-title{font-size:20px;font-weight:900;line-height:1.3}
.product-price{color:var(--r);font-weight:900;font-size:26px;margin-top:10px}
.product-desc{color:var(--m);font-size:15px;line-height:1.6;margin-top:14px;white-space:pre-wrap}
.seller{display:flex;align-items:center;gap:12px;padding:14px;background:var(--c);border:1px solid var(--b);border-radius:14px;margin-top:18px;cursor:pointer}
.seller-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--r),#7a0f0f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;flex-shrink:0;overflow:hidden}
.seller-av img{width:100%;height:100%;object-fit:cover}
.seller-info{flex:1;min-width:0}
.seller-name{font-weight:800;font-size:15px}
.seller-handle{color:var(--m);font-size:13px;margin-top:2px}
.product-actions{display:flex;gap:10px;padding:0 16px 24px;margin-top:16px}
.action-buy{flex:1;padding:15px;border-radius:12px;background:var(--r);color:#fff;border:none;font-weight:800;font-size:15px;font-family:inherit}
.action-msg{flex:1;padding:15px;border-radius:12px;background:transparent;color:var(--t);border:1px solid var(--b);font-weight:800;font-size:15px;font-family:inherit}
.tabs{display:flex;border-bottom:1px solid var(--b);background:var(--bg);position:sticky;top:60px;z-index:4}
.tab{flex:1;background:transparent;border:none;color:var(--m);font-weight:700;font-size:14px;padding:14px 0;position:relative;font-family:inherit}
.tab.active{color:var(--t)}
.tab.active:after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:40px;height:3px;background:var(--r);border-radius:3px 3px 0 0}
.o-row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--b);cursor:pointer;align-items:center}
.o-thumb{width:60px;height:60px;border-radius:12px;background:var(--c);border:1px solid var(--b);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.o-thumb img{width:100%;height:100%;object-fit:cover}
.o-info{flex:1;min-width:0}
.o-title{font-weight:700;font-size:14px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o-sub{color:var(--m);font-size:12px}
.o-price{color:var(--r);font-weight:900;font-size:15px;margin-top:4px}
.o-status{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
.o-status.placed{background:rgba(255,45,45,.15);color:var(--r);border:1px solid var(--r)}
.o-status.shipped{background:rgba(255,180,0,.15);color:var(--y);border:1px solid var(--y)}
.o-status.delivered{background:rgba(74,222,128,.15);color:var(--gr);border:1px solid var(--gr)}
.o-status.cancelled{background:#2a2a2a;color:var(--m);border:1px solid var(--b)}
.od-body{padding:18px 16px}
.od-status-card{padding:18px;border-radius:16px;background:var(--c);border:1px solid var(--b);text-align:center;margin-bottom:18px}
.od-status-card .big{font-size:48px;display:block;margin-bottom:10px}
.od-status-card .st{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--r)}
.od-status-card .st.shipped{color:var(--y)}
.od-status-card .st.delivered{color:var(--gr)}
.od-status-card .st.cancelled{color:var(--m)}
.od-status-card .desc{color:var(--m);font-size:13px;margin-top:8px;line-height:1.5}
.od-product{display:flex;gap:12px;padding:14px;background:var(--c);border:1px solid var(--b);border-radius:14px;margin-bottom:14px;cursor:pointer}
.od-thumb{width:70px;height:70px;border-radius:12px;background:linear-gradient(135deg,#2a0a0a,#4a0f0f);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.od-thumb img{width:100%;height:100%;object-fit:cover}
.od-info{flex:1;min-width:0}
.od-t{font-weight:800;font-size:15px;margin-bottom:4px}
.od-p{color:var(--r);font-weight:900;font-size:17px}
.od-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--b);font-size:14px}
.od-row:last-child{border-bottom:none}
.od-row .k{color:var(--m)}
.od-row .v{font-weight:700}
.od-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.od-btn{padding:15px;border-radius:12px;border:none;font-weight:800;font-size:15px;font-family:inherit;width:100%}
.od-btn.primary{background:var(--r);color:#fff}
.od-btn.ghost{background:transparent;color:var(--t);border:1px solid var(--b)}
.od-btn.danger{background:transparent;color:var(--r);border:1px solid var(--r)}
.co-product{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--b)}
.co-info{flex:1}
.co-t{font-weight:800;font-size:16px;margin-bottom:4px}
.co-p{color:var(--r);font-weight:900;font-size:20px}
.co-s{color:var(--m);font-size:13px;margin-top:4px}
.co-section{padding:16px;border-bottom:1px solid var(--b)}
.co-label{font-size:12px;font-weight:800;color:var(--m);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.co-note{color:var(--m);font-size:14px;line-height:1.6}
.co-total{display:flex;justify-content:space-between;padding:16px;font-size:16px;font-weight:800}
.co-total .val{color:var(--r);font-size:20px}
.tst{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--c);border:1px solid var(--b);color:var(--t);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:200;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:90%}
.tst.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
.tst.ok{border-color:var(--gr);color:var(--gr)}
.tst.err{border-color:var(--r);color:#ff8b8b}
</style>
</head>
<body>

<div id="loading" style="min-height:100vh;display:flex;flex-direction:column;">
<div class="loader"></div>
<div class="ldt">Loading marketplace...</div>
<div id="err" class="err"></div>
</div>

<div id="main" style="display:none;">
<div id="listingsView">
<header>
<button class="back" onclick="location.href='mintr-feed.html'">←</button>
<div class="title">Marketplace</div>
<div class="hdr-right">
<button class="hbtn" id="ordersBtn">Orders</button>
<button class="hbtn primary" id="addBtn">+ Sell</button>
</div>
</header>
<div class="hero"><input type="text" class="search" id="search" placeholder="Search products..."/></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
</div>

<div class="page" id="newPage">
<div class="ph"><button class="bk" id="newBack">✕</button><div class="pt">New listing</div><div style="width:36px"></div></div>
<div class="form">
<div class="field"><label>Title</label><input type="text" id="lTitle" placeholder="e.g. Nike Air Max 97" maxlength="80"/></div>
<div class="field"><label>Price (₦)</label><input type="text" id="lPrice" placeholder="e.g. 185000" maxlength="20"/></div>
<div class="field"><label>Category</label>
<select id="lCat">
<option>Fashion</option><option>Sneakers</option><option>Art</option><option>Tech</option>
<option>Home</option><option>Food</option><option>Other</option>
</select></div>
<div class="field"><label>Description</label><textarea id="lDesc" placeholder="Describe the product, condition, size, shipping..." maxlength="500"></textarea></div>
<div class="field"><label>Photos (up to 4)</label><div class="photos" id="photoGrid"></div></div>
</div>
<div class="submit-bar"><button class="submit" id="lSubmit" disabled>Publish listing</button></div>
<input type="file" id="photoInput" accept="image/*" style="display:none"/>
</div>

<div class="page" id="prodPage">
<div class="ph"><button class="bk" id="prodBack">←</button><div class="pt">Product</div><div style="width:36px"></div></div>
<div id="prodContent"></div>
</div>

<div class="page" id="coPage">
<div class="ph"><button class="bk" id="coBack">←</button><div class="pt">Checkout</div><div style="width:36px"></div></div>
<div id="coContent"></div>
<div class="submit-bar"><button class="submit" id="coConfirm">Place order</button></div>
</div>

<div class="page" id="ordersPage">
<div class="ph"><button class="bk" id="ordersBack">←</button><div class="pt">Orders</div><div style="width:36px"></div></div>
<div class="tabs">
<button class="tab active" data-ot="purchases">Purchases</button>
<button class="tab" data-ot="sales">Sales</button>
</div>
<div id="ordersList"></div>
</div>

<div class="page" id="orderPage">
<div class="ph"><button class="bk" id="orderBack">←</button><div class="pt">Order</div><div style="width:36px"></div></div>
<div id="orderContent"></div>
</div>

<div class="tst" id="tst"></div>
</div>

<script>
window.addEventListener('error',function(e){
  var b=document.getElementById('err');
  if(b)b.textContent='ERROR: '+(e.message||'unknown')+' @ '+(e.lineno||'?');
});

firebase.initializeApp({
apiKey:"AIzaSyBXOZBv0t9tqNUt3Jj6FpM5w4kpRBliodQ",
authDomain:"mintr-fbf19.firebaseapp.com",
databaseURL:"https://mintr-fbf19-default-rtdb.firebaseio.com",
projectId:"mintr-fbf19",
storageBucket:"mintr-fbf19.firebasestorage.app",
messagingSenderId:"308745133225",
appId:"1:308745133225:web:4b9ff9ac1d8849b134ddb8"
});
var auth=firebase.auth(),db=firebase.database();
var CU=null,me={};
var allListings={};
var currentCat='All';
var currentQuery='';
var currentProdId=null;
var currentCoProdId=null;
var currentOrderId=null;
var ordersTab='purchases';
var uploadedPhotos=[];
var listingsRef=null,myOrdersRef=null;
var myOrders={};
var allOrders={};

var CATS=['All','Fashion','Sneakers','Art','Tech','Home','Food','Other'];

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function toast(msg,kind){var t=document.getElementById('tst');t.textContent=msg;t.className='tst show '+(kind||'');setTimeout(function(){t.className='tst '+(kind||'');},2500);}
function ago(ts){if(!ts)return'';var d=Date.now()-ts,s=Math.floor(d/1000);if(s<60)return s+'s ago';var m=Math.floor(s/60);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';var dd=Math.floor(h/24);if(dd<7)return dd+'d ago';return new Date(ts).toLocaleDateString();}
function money(v){return '₦'+esc(String(v||'0'));}
function catIcon(cat){return cat==='Sneakers'?'👟':cat==='Art'?'🎨':cat==='Fashion'?'👕':cat==='Tech'?'📱':cat==='Food'?'🍕':cat==='Home'?'🛋':'📦';}

/* ===== DRAFT ===== */
function saveDraft(){
  try{localStorage.setItem('mntr_draft_listing',JSON.stringify({
    title:document.getElementById('lTitle').value,
    price:document.getElementById('lPrice').value,
    cat:document.getElementById('lCat').value,
    desc:document.getElementById('lDesc').value,
    photos:uploadedPhotos.slice()
  }));}catch(e){}
}
function clearDraft(){try{localStorage.removeItem('mntr_draft_listing');}catch(e){}}

function renderCats(){
  var c=document.getElementById('cats');c.innerHTML='';
  CATS.forEach(function(cat){
    var b=document.createElement('button');
    b.className='cat'+(cat===currentCat?' active':'');
    b.textContent=cat;b.dataset.cat=cat;
    c.appendChild(b);
  });
}
document.getElementById('cats').addEventListener('click',function(e){
  var b=e.target.closest('.cat');if(!b)return;
  currentCat=b.dataset.cat;renderCats();renderGrid();
});

function renderGrid(){
  var g=document.getElementById('grid');
  g.innerHTML='';
  var list=Object.keys(allListings).map(function(k){var l=allListings[k];l._id=k;return l;});
  if(currentCat!=='All')list=list.filter(function(l){return (l.category||'Other')===currentCat;});
  if(currentQuery){
    var q=currentQuery.toLowerCase();
    list=list.filter(function(l){return ((l.title||'')+' '+(l.description||'')+' '+(l.sellerUsername||'')).toLowerCase().indexOf(q)>-1;});
  }
  list.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  if(!list.length){
    g.innerHTML='<div class="empty" style="grid-column:1/-1"><span class="big">🛍</span>'+(currentQuery?'No results for "'+esc(currentQuery)+'"':'No listings yet.<br><br>'+(CU?'Tap <b>Sell</b> to post the first one.':'Browse later.'))+'</div>';
    return;
  }
  list.forEach(function(l){
    var el=document.createElement('div');el.className='card';
    var img=document.createElement('div');img.className='card-img';
    if(l.images&&l.images.length)img.innerHTML='<img src="'+l.images[0]+'" alt=""/>';
    else img.textContent=catIcon(l.category||'Other');
    var body=document.createElement('div');body.className='card-body';
    body.innerHTML='<div class="card-title">'+esc(l.title||'Untitled')+'</div><div class="card-price">'+money(l.price)+'</div><div class="card-seller">@'+esc(l.sellerUsername||'user')+'</div>';
    el.appendChild(img);el.appendChild(body);
    el.addEventListener('click',function(){openProduct(l._id);});
    g.appendChild(el);
  });
}
document.getElementById('search').addEventListener('input',function(){currentQuery=this.value.trim();renderGrid();});
function watchListings(){
  if(listingsRef)listingsRef.off();
  listingsRef=db.ref('listings');
  listingsRef.on('value',function(s){allListings=s.val()||{};renderGrid();});
}

/* ===== NEW LISTING (draft-aware) ===== */
function openNewListing(){
  var d=null;
  try{var r=localStorage.getItem('mntr_draft_listing');if(r)d=JSON.parse(r);}catch(e){}
  if(d){
    uploadedPhotos=d.photos||[];
    document.getElementById('lTitle').value=d.title||'';
    document.getElementById('lPrice').value=d.price||'';
    document.getElementById('lCat').value=d.cat||'Fashion';
    document.getElementById('lDesc').value=d.desc||'';
  } else {
    uploadedPhotos=[];
    ['lTitle','lPrice','lDesc'].forEach(function(id){document.getElementById(id).value='';});
    document.getElementById('lCat').value='Fashion';
  }
  renderPhotoGrid();updateSubmitState();
  document.getElementById('newPage').classList.add('open');
}
function closeNewListing(){document.getElementById('newPage').classList.remove('open');}
function renderPhotoGrid(){
  var g=document.getElementById('photoGrid');g.innerHTML='';
  uploadedPhotos.forEach(function(src,i){
    var el=document.createElement('div');el.className='ph-item';
    el.innerHTML='<img src="'+src+'" alt=""/><button class="rm" data-i="'+i+'">✕</button>';
    g.appendChild(el);
  });
  if(uploadedPhotos.length<4){
    var add=document.createElement('div');add.className='ph-item';
    add.innerHTML='<div class="plus">+</div>';
    add.addEventListener('click',function(){document.getElementById('photoInput').click();});
    g.appendChild(add);
  }
  g.querySelectorAll('.rm').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      uploadedPhotos.splice(parseInt(b.dataset.i,10),1);
      renderPhotoGrid();saveDraft();
    });
  });
}
document.getElementById('photoInput').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  if(f.size>400000){toast('Photo too large (400KB max)','err');e.target.value='';return;}
  var r=new FileReader();
  r.onload=function(ev){uploadedPhotos.push(ev.target.result);renderPhotoGrid();saveDraft();};
  r.readAsDataURL(f);e.target.value='';
});
['lTitle','lPrice','lDesc'].forEach(function(id){
  document.getElementById(id).addEventListener('input',function(){updateSubmitState();saveDraft();});
});
document.getElementById('lCat').addEventListener('change',saveDraft);
function updateSubmitState(){
  var t=document.getElementById('lTitle').value.trim();
  var p=document.getElementById('lPrice').value.trim();
  document.getElementById('lSubmit').disabled=!(t&&p);
}
document.getElementById('lSubmit').addEventListener('click',function(){
  var btn=this;
  var title=document.getElementById('lTitle').value.trim();
  var price=document.getElementById('lPrice').value.trim();
  var cat=document.getElementById('lCat').value;
  var desc=document.getElementById('lDesc').value.trim();
  if(!title||!price){toast('Fill in title and price','err');return;}
  btn.disabled=true;btn.textContent='Publishing...';
  var listing={
    sellerUid:CU.uid,sellerUsername:me.username||'user',sellerDisplayName:me.displayName||'Seller',sellerPhoto:me.photo||null,
    title:title,price:price,category:cat,description:desc,images:uploadedPhotos.slice(),
    createdAt:Date.now(),status:'active'
  };
  db.ref('listings').push(listing).then(function(){
    btn.disabled=false;btn.textContent='Publish listing';
    clearDraft();closeNewListing();toast('Listing published ✅','ok');
  }).catch(function(err){
    btn.disabled=false;btn.textContent='Publish listing';
    toast('Failed: '+err.message,'err');
  });
});

/* ===== PRODUCT DETAIL ===== */
function openProduct(id){
  var l=allListings[id];if(!l){toast('Product not found','err');return;}
  currentProdId=id;
  var wrap=document.getElementById('prodContent');
  var imgs=(l.images||[]);
  var heroHtml='<div class="product-hero" id="prodHero">';
  if(imgs.length)heroHtml+='<img src="'+imgs[0]+'" alt="" id="prodHeroImg"/>';
  else heroHtml+=catIcon(l.category||'Other');
  heroHtml+='</div>';
  var thumbsHtml='';
  if(imgs.length>1){
    thumbsHtml='<div class="product-thumbs">';
    imgs.forEach(function(src,i){thumbsHtml+='<div class="pt-thumb'+(i===0?' on':'')+'" data-i="'+i+'"><img src="'+src+'" alt=""/></div>';});
    thumbsHtml+='</div>';
  }
  var sellerAv=l.sellerPhoto?'<img src="'+l.sellerPhoto+'" alt=""/>':esc((l.sellerDisplayName||l.sellerUsername||'?')[0].toUpperCase());
  wrap.innerHTML=
    heroHtml+thumbsHtml+
    '<div class="product-body">'+
      '<div class="product-title">'+esc(l.title||'Untitled')+'</div>'+
      '<div class="product-price">'+money(l.price)+'</div>'+
      (l.description?'<div class="product-desc">'+esc(l.description)+'</div>':'')+
      '<div class="seller" id="sellerCard">'+
        '<div class="seller-av">'+sellerAv+'</div>'+
        '<div class="seller-info"><div class="seller-name">'+esc(l.sellerDisplayName||'Seller')+'</div><div class="seller-handle">@'+esc(l.sellerUsername||'user')+'</div></div>'+
        '<div style="color:var(--m);font-size:20px">›</div>'+
      '</div>'+
    '</div>'+
    '<div class="product-actions">'+
      '<button class="action-msg" id="btnMsg">Message</button>'+
      '<button class="action-buy" id="btnBuy">Buy now</button>'+
    '</div>';
  wrap.querySelectorAll('.pt-thumb').forEach(function(t){
    t.addEventListener('click',function(){
      var i=parseInt(t.dataset.i,10);
      document.getElementById('prodHeroImg').src=imgs[i];
      wrap.querySelectorAll('.pt-thumb').forEach(function(x){x.classList.remove('on');});
      t.classList.add('on');
    });
  });
  document.getElementById('sellerCard').addEventListener('click',function(){
    if(l.sellerUid)location.href='mintr-feed.html#profile='+l.sellerUid;
  });
  document.getElementById('btnMsg').addEventListener('click',function(){
    if(!l.sellerUid)return;
    if(l.sellerUid===CU.uid){toast('This is your listing','err');return;}
    location.href='mintr-chat.html?with='+l.sellerUid;
  });
  document.getElementById('btnBuy').addEventListener('click',function(){
    if(l.sellerUid===CU.uid){toast('You can\'t buy your own listing','err');return;}
    openCheckout(id);
  });
  document.getElementById('prodPage').classList.add('open');
}
function closeProduct(){document.getElementById('prodPage').classList.remove('open');currentProdId=null;}

/* ===== CHECKOUT ===== */
function openCheckout(id){
  var l=allListings[id];if(!l)return;
  currentCoProdId=id;
  var wrap=document.getElementById('coContent');
  var imgHtml=(l.images&&l.images[0])?'<div class="od-thumb"><img src="'+l.images[0]+'" alt=""/></div>':'<div class="od-thumb">'+catIcon(l.category||'Other')+'</div>';
  wrap.innerHTML=
    '<div class="co-product">'+imgHtml+
      '<div class="co-info"><div class="co-t">'+esc(l.title||'Untitled')+'</div><div class="co-p">'+money(l.price)+'</div><div class="co-s">Sold by @'+esc(l.sellerUsername||'user')+'</div></div>'+
    '</div>'+
    '<div class="co-section"><div class="co-label">Order summary</div><div class="co-note">Your order is protected by <b style="color:var(--t)">escrow</b>. The seller receives payment only after you confirm you\'ve received the item.</div></div>'+
    '<div class="co-section"><div class="co-label">Payment</div><div class="co-note">Card, transfer and USSD arrive in <b style="color:var(--t)">Stage 4c</b>. Placing an order now reserves the item and notifies the seller.</div></div>'+
    '<div class="co-total"><span>Total</span><span class="val">'+money(l.price)+'</span></div>';
  document.getElementById('coConfirm').textContent='Place order';
  document.getElementById('coConfirm').disabled=false;
  document.getElementById('coPage').classList.add('open');
}
function closeCheckout(){document.getElementById('coPage').classList.remove('open');currentCoProdId=null;}

document.getElementById('coConfirm').addEventListener('click',function(){
  var l=allListings[currentCoProdId];if(!l)return;
  var btn=this;
  btn.disabled=true;btn.textContent='Placing order...';
  var order={
    buyerUid:CU.uid,buyerUsername:me.username||'user',buyerDisplayName:me.displayName||'Buyer',
    sellerUid:l.sellerUid,sellerUsername:l.sellerUsername||'user',sellerDisplayName:l.sellerDisplayName||'Seller',
    listingId:currentCoProdId,listingTitle:l.title||'Untitled',listingPrice:l.price||'0',
    listingImage:(l.images&&l.images[0])||null,listingCategory:l.category||'Other',
    status:'placed',createdAt:Date.now(),updatedAt:Date.now()
  };
  var orderId=db.ref('orders').push().key;
  var updates={};
  updates['orders/'+orderId]=order;
  updates['userOrders/'+CU.uid+'/'+orderId]=true;
  updates['userOrders/'+l.sellerUid+'/'+orderId]=true;
  if(l.sellerUid){
    var notifId=db.ref('notifications/'+l.sellerUid).push().key;
    updates['notifications/'+l.sellerUid+'/'+notifId]={
      type:'order',read:false,fromUid:CU.uid,fromName:me.displayName||'Someone',
      fromUsername:me.username||'user',fromPhoto:me.photo||null,orderId:orderId,
      text:(l.title||'Item')+' — '+money(l.price),createdAt:Date.now()
    };
  }
  db.ref().update(updates).then(function(){
    btn.disabled=false;btn.textContent='Place order';
    closeCheckout();closeProduct();
    toast('Order placed ✅','ok');
    setTimeout(function(){openOrders('purchases');},400);
  }).catch(function(e){
    btn.disabled=false;btn.textContent='Place order';
    toast('Failed: '+e.message,'err');
  });
});

/* ===== ORDERS ===== */
function openOrders(tab){
  ordersTab=tab||'purchases';
  document.querySelectorAll('#ordersPage .tab').forEach(function(t){
    t.classList.toggle('active',t.dataset.ot===ordersTab);
  });
  renderOrders();
  document.getElementById('ordersPage').classList.add('open');
}
function closeOrders(){document.getElementById('ordersPage').classList.remove('open');}
document.querySelectorAll('#ordersPage .tab').forEach(function(t){
  t.addEventListener('click',function(){
    ordersTab=t.dataset.ot;
    document.querySelectorAll('#ordersPage .tab').forEach(function(x){x.classList.toggle('active',x===t);});
    renderOrders();
  });
});

function watchMyOrders(){
  if(myOrdersRef)myOrdersRef.off();
  myOrdersRef=db.ref('userOrders/'+CU.uid);
  myOrdersRef.on('value',function(s){
    myOrders=s.val()||{};
    var ids=Object.keys(myOrders);
    if(!ids.length){allOrders={};if(document.getElementById('ordersPage').classList.contains('open'))renderOrders();return;}
    var pending=ids.length;
    ids.forEach(function(oid){
      db.ref('orders/'+oid).once('value',function(os){
        allOrders[oid]=os.val();
        pending--;
        if(pending===0 && document.getElementById('ordersPage').classList.contains('open'))renderOrders();
      });
    });
  });
}

function renderOrders(){
  var list=document.getElementById('ordersList');
  var ids=Object.keys(myOrders);
  if(!ids.length){
    list.innerHTML='<div class="empty"><span class="big">📦</span>No orders yet.<br><br>'+(ordersTab==='purchases'?'Buy something from the marketplace.':'Wait for someone to buy from you.')+'</div>';
    return;
  }
  var items=ids.map(function(id){return {id:id,o:allOrders[id]};}).filter(function(x){return x.o;});
  items=items.filter(function(x){
    if(ordersTab==='purchases')return x.o.buyerUid===CU.uid;
    return x.o.sellerUid===CU.uid;
  });
  items.sort(function(a,b){return (b.o.createdAt||0)-(a.o.createdAt||0);});
  list.innerHTML='';
  if(!items.length){
    list.innerHTML='<div class="empty"><span class="big">📦</span>Nothing here yet.</div>';
    return;
  }
  items.forEach(function(x){
    var o=x.o;
    var other=ordersTab==='purchases'?(o.sellerDisplayName||'Seller'):(o.buyerDisplayName||'Buyer');
    var otherRole=ordersTab==='purchases'?'From':'Buyer';
    var thumb=o.listingImage?'<div class="o-thumb"><img src="'+o.listingImage+'" alt=""/></div>':'<div class="o-thumb">'+catIcon(o.listingCategory||'Other')+'</div>';
    var el=document.createElement('div');el.className='o-row';
    el.innerHTML=thumb+
      '<div class="o-info"><div class="o-title">'+esc(o.listingTitle)+'</div><div class="o-sub">'+otherRole+': '+esc(other)+'</div><div class="o-price">'+money(o.listingPrice)+'</div></div>'+
      '<span class="o-status '+o.status+'">'+o.status+'</span>';
    el.addEventListener('click',function(){openOrder(x.id);});
    list.appendChild(el);
  });
}

/* ===== ORDER DETAIL ===== */
function openOrder(id){
  var o=allOrders[id];
  if(!o){toast('Order not found','err');return;}
  currentOrderId=id;
  var wrap=document.getElementById('orderContent');
  var isBuyer=o.buyerUid===CU.uid;
  var isSeller=o.sellerUid===CU.uid;
  var statusIcon=o.status==='placed'?'📦':o.status==='shipped'?'🚚':o.status==='delivered'?'✅':'❌';
  var statusDesc=o.status==='placed'?(isSeller?'Buyer placed the order. Ship the item, then mark it as shipped.':'Waiting for seller to ship.'):
                  o.status==='shipped'?(isBuyer?'Seller shipped. Mark as delivered when you receive it.':'Waiting for buyer to confirm delivery.'):
                  o.status==='delivered'?'Order complete. Payment released to seller (coming in Stage 4c).':'Order cancelled.';
  var thumb=o.listingImage?'<div class="od-thumb"><img src="'+o.listingImage+'" alt=""/></div>':'<div class="od-thumb">'+catIcon(o.listingCategory||'Other')+'</div>';
  var actionsHtml='';
  if(isSeller&&o.status==='placed')actionsHtml+='<button class="od-btn primary" id="markShipped">Mark as shipped</button>';
  if(isBuyer&&o.status==='shipped')actionsHtml+='<button class="od-btn primary" id="markDelivered">Confirm delivery</button>';
  if(isBuyer&&o.status==='placed')actionsHtml+='<button class="od-btn danger" id="cancelOrder">Cancel order</button>';
  if(o.status==='delivered')actionsHtml+='<div style="text-align:center;color:var(--m);font-size:13px;line-height:1.6;padding:14px 0">Order complete ✅<br>Escrow payout coming in Stage 4c</div>';
  wrap.innerHTML=
    '<div class="od-body">'+
      '<div class="od-status-card"><span class="big">'+statusIcon+'</span><div class="st '+o.status+'">'+o.status+'</div><div class="desc">'+statusDesc+'</div></div>'+
      '<div class="od-product" id="odProd">'+thumb+'<div class="od-info"><div class="od-t">'+esc(o.listingTitle)+'</div><div class="od-p">'+money(o.listingPrice)+'</div></div></div>'+
      '<div style="background:var(--c);border:1px solid var(--b);border-radius:14px;padding:4px 16px;margin-bottom:14px">'+
        '<div class="od-row"><span class="k">Buyer</span><span class="v">@'+esc(o.buyerUsername)+'</span></div>'+
        '<div class="od-row"><span class="k">Seller</span><span class="v">@'+esc(o.sellerUsername)+'</span></div>'+
        '<div class="od-row"><span class="k">Order placed</span><span class="v">'+ago(o.createdAt)+'</span></div>'+
        '<div class="od-row"><span class="k">Order ID</span><span class="v" style="font-family:monospace;font-size:12px">'+esc(id).slice(-8)+'</span></div>'+
      '</div>'+
      (actionsHtml?'<div class="od-actions">'+actionsHtml+'</div>':'')+
    '</div>';
  document.getElementById('odProd').addEventListener('click',function(){
    closeOrder();
    if(o.listingId && allListings[o.listingId])openProduct(o.listingId);
  });
  var ms=document.getElementById('markShipped');
  if(ms)ms.addEventListener('click',function(){updateOrderStatus(id,'shipped');});
  var md=document.getElementById('markDelivered');
  if(md)md.addEventListener('click',function(){updateOrderStatus(id,'delivered');});
  var co=document.getElementById('cancelOrder');
  if(co)co.addEventListener('click',function(){updateOrderStatus(id,'cancelled');});
  document.getElementById('orderPage').classList.add('open');
}
function closeOrder(){document.getElementById('orderPage').classList.remove('open');currentOrderId=null;}

function updateOrderStatus(id,status){
  var o=allOrders[id];if(!o)return;
  var updates={};
  updates['orders/'+id+'/status']=status;
  updates['orders/'+id+'/updatedAt']=Date.now();
  var notifyUid=(o.buyerUid===CU.uid)?o.sellerUid:o.buyerUid;
  if(notifyUid){
    var nid=db.ref('notifications/'+notifyUid).push().key;
    updates['notifications/'+notifyUid+'/'+nid]={
      type:'order',read:false,fromUid:CU.uid,fromName:me.displayName||'Someone',
      fromUsername:me.username||'user',fromPhoto:me.photo||null,orderId:id,
      text:(o.listingTitle||'Item')+' — '+status,createdAt:Date.now()
    };
  }
  db.ref().update(updates).then(function(){
    toast('Order '+status,'ok');
    allOrders[id].status=status;
    renderOrders();
    openOrder(id);
  });
}

document.getElementById('addBtn').addEventListener('click',openNewListing);
document.getElementById('newBack').addEventListener('click',closeNewListing);
document.getElementById('prodBack').addEventListener('click',closeProduct);
document.getElementById('coBack').addEventListener('click',closeCheckout);
document.getElementById('ordersBtn').addEventListener('click',function(){openOrders('purchases');});
document.getElementById('ordersBack').addEventListener('click',closeOrders);
document.getElementById('orderBack').addEventListener('click',function(){closeOrder();renderOrders();});

auth.onAuthStateChanged(function(u){
  if(!u){location.href='index.html';return;}
  CU=u;
  db.ref('users/'+u.uid).once('value',function(s){
    me=s.val()||{};
    document.getElementById('loading').style.display='none';
    document.getElementById('main').style.display='block';
    renderCats();watchListings();watchMyOrders();
    // Auto-restore draft after iOS page reload (photo picker)
    try{var r=localStorage.getItem('mntr_draft_listing');
      if(r){var d=JSON.parse(r);if(d&&((d.title||d.price)||(d.photos&&d.photos.length)))setTimeout(openNewListing,300);}
    }catch(e){}
  });
});
</script>
