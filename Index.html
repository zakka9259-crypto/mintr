<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mintr</title>
<style>
:root{--bg:#0a0a0a;--card:#121212;--border:#1f1f1f;--text:#f2f2f2;--muted:#7a7a7a;--red:#ff2d2d;--gold:#ffd700}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--red)}
.avatar-small{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0f0f);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-family:inherit}
.chat-icon{width:36px;height:36px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.feed-tabs{display:flex;border-top:1px solid var(--border)}
.tab{flex:1;background:transparent;border:none;color:var(--muted);font-size:15px;font-weight:700;padding:14px 0;position:relative;font-family:inherit}
.tab.active{color:var(--text)}
.tab.active::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:46px;height:3px;background:var(--red);border-radius:3px 3px 0 0}
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto;border-bottom:8px solid #050505}
.stories::-webkit-scrollbar{display:none}
.story{flex-shrink:0;text-align:center;width:66px}
.story-ring{width:62px;height:62px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--red),#7a0f0f);display:flex;align-items:center;justify-content:center}
.story-ring.business{background:linear-gradient(135deg,var(--gold),var(--red))}
.story-ring.seen{background:#2a2a2a}
.story-inner{width:100%;height:100%;border-radius:50%;background:var(--card);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.story-name{margin-top:6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-name.me{color:var(--text)}
.composer{background:var(--bg);padding:16px;border-bottom:8px solid #050505;display:flex;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--red),#7a0f0f);display:flex;align-items:center;justify-content:center;font-weight:800}
.composer-right{flex:1;min-width:0}
.composer textarea{width:100%;border:none;outline:none;background:transparent;color:var(--text);font-size:17px;font-family:inherit;resize:none;min-height:56px;padding-top:10px}
.composer textarea::placeholder{color:var(--muted)}
.composer-bar{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.composer-tools{display:flex;gap:16px;color:var(--red);font-size:18px}
.post-btn{background:var(--red);color:#fff;border:none;padding:9px 22px;border-radius:999px;font-weight:800;font-size:15px;font-family:inherit}
.post-btn:disabled{opacity:0.35}
.post{background:var(--bg);padding:16px;border-bottom:1px solid var(--border);display:flex;gap:12px}
.post-content{flex:1;min-width:0}
.post-header{display:flex;align-items:center;gap:5px;font-size:15px;margin-bottom:3px;flex-wrap:wrap}
.post-name{font-weight:800}
.badge-biz{font-size:10px;font-weight:800;letter-spacing:0.4px;background:var(--red);color:#fff;padding:2px 6px;border-radius:4px}
.post-handle,.post-time{color:var(--muted);font-size:14px}
.post-text{font-size:16px;line-height:1.45;margin-bottom:12px;word-wrap:break-word}
.shop-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.shop-img{height:160px;background:linear-gradient(135deg,#2a0a0a,#4a0f0f);display:flex;align-items:center;justify-content:center;font-size:42px}
.shop-info{padding:12px 14px}
.shop-title{font-weight:700;font-size:15px;margin-bottom:4px}
.shop-price{color:var(--red);font-weight:800;font-size:17px}
.shop-meta{color:var(--muted);font-size:13px;margin-top:4px}
.shop-actions{display:flex;gap:8px;margin-top:10px}
.buy-btn{flex:1;background:var(--red);color:#fff;border:none;padding:11px;border-radius:10px;font-weight:800;font-size:14px;font-family:inherit}
.save-btn{flex:1;background:transparent;color:var(--text);border:1px solid var(--border);padding:11px;border-radius:10px;font-weight:700;font-size:14px;font-family:inherit}
.actions{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;max-width:320px}
.action{display:flex;align-items:center;gap:5px}
.action.liked{color:var(--red)}
.shop-tag{color:var(--red);font-weight:700;font-size:12px;border:1px solid var(--red);padding:2px 8px;border-radius:999px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(10,10,10,0.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.nav-item{font-size:20px;color:var(--muted);padding:4px 14px;background:none;border:none;font-family:inherit}
.nav-item.active{color:var(--red)}
.nav-item.market{font-size:22px;background:var(--red);color:#fff;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(255,45,45,0.5);margin-top:-12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:var(--bg);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform 0.25s ease;z-index:50;padding:20px 0;display:flex;flex-direction:column;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.sidebar-top{padding:8px 20px 22px;border-bottom:1px solid var(--border)}
.avatar-big{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0f0f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;margin-bottom:12px}
.sidebar-name{font-weight:800;font-size:17px}
.sidebar-handle{color:var(--muted);font-size:14px;margin-top:2px}
.sidebar-item{background:transparent;border:none;color:var(--text);font-size:16px;font-family:inherit;text-align:left;padding:16px 20px;display:flex;align-items:center;gap:14px;font-weight:600;width:100%}
.sidebar-item:active{background:#181818}
.soon{font-size:10px;font-weight:800;background:var(--red);color:#fff;padding:2px 6px;border-radius:4px;margin-left:auto}
.chat-panel{position:fixed;top:0;right:0;bottom:0;width:88%;max-width:380px;background:var(--bg);border-left:1px solid var(--border);transform:translateX(100%);transition:transform 0.25s ease;z-index:50;display:flex;flex-direction:column}
.chat-panel.open{transform:translateX(0)}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.chat-title{font-size:20px;font-weight:900}
.chat-new{width:36px;height:36px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--text);font-size:16px;font-family:inherit}
.chat-search{margin:12px 16px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
.chat-search::placeholder{color:var(--muted)}
.chat-list{flex:1;overflow-y:auto}
.chat-row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);align-items:center}
.chat-row.unread .chat-name{font-weight:800}
.chat-row.unread .chat-last{color:var(--text)}
.chat-avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--red),#7a0f0f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px}
.chat-avatar.biz{background:linear-gradient(135deg,var(--gold),var(--red))}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:15px;font-weight:700}
.chat-last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chat-time{color:var(--muted);font-size:12px}
.chat-dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
.page{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;transform:translateX(100%);transition:transform 0.25s ease;padding-bottom:40px}
.page.open{transform:translateX(0)}
.page-header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.back-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--text);font-size:18px;font-family:inherit}
.page-title{font-weight:800;font-size:17px}
.profile-banner{height:110px;background:linear-gradient(135deg,#1a0505,#4a0f0f,#7a0f0f)}
.profile-body{padding:0 16px 16px}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0f0f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px;color:#fff;border:4px solid var(--bg);margin-top:-40px;margin-bottom:12px}
.profile-name{font-size:20px;font-weight:900}
.profile-handle{color:var(--muted);font-size:15px;margin-top:2px}
.profile-bio{font-size:15px;line-height:1.4;margin-top:12px}
.profile-stats{display:flex;gap:20px;margin-top:12px;font-size:14px;color:var(--muted)}
.profile-stats b{color:var(--text);font-weight:800}
.edit-btn{margin-top:16px;padding:10px 22px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:999px;font-weight:700;font-size:14px;font-family:inherit}
.profile-tabs{display:flex;border-bottom:1px solid var(--border);margin-top:12px;position:sticky;top:62px;background:var(--bg);z-index:4}
.ptab{flex:1;background:transparent;border:none;color:var(--muted);font-weight:700;font-size:14px;padding:14px 0;position:relative;font-family:inherit}
.ptab.active{color:var(--text)}
.ptab.active::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:40px;height:3px;background:var(--red);border-radius:3px 3px 0 0}
.market-search{padding:12px 16px}
.market-search input{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;outline:none;font-family:inherit}
.market-search input::placeholder{color:var(--muted)}
.market-cats{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.market-cats::-webkit-scrollbar{display:none}
.mcat{flex-shrink:0;padding:8px 16px;border-radius:999px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:700;font-family:inherit}
.mcat.active{background:var(--red);border-color:var(--red);color:#fff}
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 20px}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.mcard-img{height:130px;background:linear-gradient(135deg,#2a0a0a,#4a0f0f);display:flex;align-items:center;justify-content:center;font-size:42px}
.mcard-info{padding:10px 12px}
.mcard-title{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard-price{color:var(--red);font-weight:800;font-size:15px}
.mcard-seller{color:var(--muted);font-size:11px;margin-top:4px}
#convPage{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.conv-user{display:flex;align-items:center;gap:10px;flex:1}
.conv-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0f0f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.conv-name{font-weight:800;font-size:15px}
.conv-status{color:var(--muted);font-size:12px}
.conv-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.conv-bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;word-wrap:break-word}
.conv-bubble.them{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.conv-bubble.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.conv-input-bar{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg)}
.conv-input{flex:1;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:15px;outline:none;font-family:inherit}
.conv-input::placeholder{color:var(--muted)}
.conv-send{width:44px;height:44px;border-radius:50%;background:var(--red);border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;font-family:inherit}
#postPage{padding-bottom:0;display:flex;flex-direction:column;overflow:hidden}
#postDetailWrap{flex:1;overflow-y:auto;padding-bottom:80px}
.post-detail{padding:16px;border-bottom:8px solid #050505;display:flex;gap:12px}
.post-detail .avatar{width:48px;height:48px}
.post-detail-text{font-size:19px;line-height:1.4;margin:8px 0 14px;word-wrap:break-word}
.post-detail-meta{color:var(--muted);font-size:14px;padding:14px 16px;border-bottom:1px solid var(--border)}
.post-detail-stats{display:flex;gap:20px;padding:12px 16px;border-bottom:8px solid #050505;font-size:14px;color:var(--muted)}
.post-detail-stats b{color:var(--text)}
.reply-row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.reply-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0f0f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0}
.reply-name{font-weight:800;font-size:14px}
.reply-handle,.reply-time{color:var(--muted);font-size:13px;font-weight:400}
.reply-text{font-size:15px;line-height:1.4;margin-top:3px}
.reply-bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);z-index:5}
.reply-input{flex:1;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:15px;outline:none;font-family:inherit}
.reply-input::placeholder{color:var(--muted)}
.reply-send{padding:0 20px;border-radius:999px;background:var(--red);border:none;color:#fff;font-weight:800;font-size:14px;font-family:inherit}
.product-hero{height:280px;background:linear-gradient(135deg,#2a0a0a,#4a0f0f);display:flex;align-items:center;justify-content:center;font-size:120px}
.product-body{padding:18px 16px}
.product-title{font-size:20px;font-weight:900;line-height:1.3}
.product-price{color:var(--red);font-weight:900;font-size:26px;margin-top:10px}
.product-desc{color:var(--muted);font-size:15px;line-height:1.5;margin-top:14px}
.product-seller{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-top:18px}
.seller-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--red));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px}
.seller-info{flex:1}
.seller-name{font-weight:800;font-size:15px}
.seller-handle{color:var(--muted);font-size:13px;margin-top:2px}
.seller-follow{padding:8px 16px;border-radius:999px;background:transparent;border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;font-family:inherit}
.product-actions{display:flex;gap:10px;margin-top:18px}
.product-buy{flex:1;padding:14px;border-radius:12px;background:var(--red);color:#fff;border:none;font-weight:800;font-size:15px;font-family:inherit}
.product-msg{flex:1;padding:14px;border-radius:12px;background:transparent;color:var(--text);border:1px solid var(--border);font-weight:800;font-size:15px;font-family:inherit}
.settings-list{padding:8px 0}
.settings-item{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--border);font-size:15px;color:var(--text);font-family:inherit;background:transparent;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.settings-item .ico{font-size:18px;width:24px;text-align:center}
.settings-item .arrow{margin-left:auto;color:var(--muted)}
.settings-section{padding:20px 16px 8px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase}
.toggle-pill{margin-left:auto;padding:4px 10px;border-radius:999px;background:#2a2a2a;color:var(--muted);font-size:11px;font-weight:800}

.search-bar-wrap{padding:12px 16px;border-bottom:1px solid var(--border)}
.search-input{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:15px;outline:none;font-family:inherit}
.search-input::placeholder{color:var(--muted)}
.search-tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:62px;background:var(--bg);z-index:4}
.stab{flex:1;background:transparent;border:none;color:var(--muted);font-weight:700;font-size:13px;padding:14px 0;position:relative;font-family:inherit}
.stab.active{color:var(--text)}
.stab.active::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:36px;height:3px;background:var(--red);border-radius:3px 3px 0 0}
.search-hint{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}

.user-avatar.biz{background:linear-gradient(135deg,var(--gold),var(--red))}
.user-info{flex:1;min-width:0}
.user-name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px}
.user-handle{color:var(--muted);font-size:13px;margin-top:2px}
.user-follow{padding:8px 16px;border-radius:999px;background:var(--red);color:#fff;border:none;font-weight:800;font-size:13px;font-family:inherit}
.section-label{padding:16px 16px 8px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase}
#composePage{padding-bottom:0;display:flex;flex-direction:column;overflow:hidden}
.compose-post{margin-left:auto;padding:8px 20px;border-radius:999px;background:var(--red);color:#fff;border:none;font-weight:800;font-size:14px;font-family:inherit}
.compose-post:disabled{opacity:0.4}
.compose-wrap{flex:1;padding:16px;display:flex;gap:12px;overflow-y:auto}
.compose-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0f0f);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.compose-right{flex:1;min-width:0;display:flex;flex-direction:column}
.compose-textarea{width:100%;border:none;outline:none;background:transparent;color:var(--text);font-size:19px;line-height:1.4;font-family:inherit;resize
